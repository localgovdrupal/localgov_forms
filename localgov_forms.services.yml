services:
  localgov_forms.geocoder_selection:
    class: Drupal\localgov_forms\Geocoders
    arguments: ['@entity_type.manager']

  localgov_forms.address_lookup:
    class: Drupal\localgov_forms\AddressLookup
    arguments: ['@geocoder', '@localgov_forms.geocoder_selection']

  # Plugin manager service for PII redaction from Webform submissions.
  plugin.manager.pii_redactor:
    class: Drupal\localgov_forms\Plugin\PIIRedactorPluginManager
    parent: default_plugin_manager

  localgov_forms.service_provider:
      class: Drupal\localgov_forms\LocalGovFormsServiceProvider
      decorates: 'form_error_handler'
      arguments: ['@localgov_forms.service_provider.inner', '@config.factory']
      aliases:
        - 'form_error_handler'
      tags:
        # Priority > 0 ensures it runs after providers with default priority.
        - { name: service_provider, priority: 0 }
